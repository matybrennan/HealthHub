name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build
        run: |
          xcodebuild build \
            -scheme HealthHub \
            -destination 'generic/platform=iOS Simulator' \
            | xcpretty

      - name: Test
        run: |
          xcodebuild test \
            -scheme HealthHub \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            | xcpretty
