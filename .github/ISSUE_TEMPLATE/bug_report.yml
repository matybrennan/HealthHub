name: Bug Report
description: Report a bug in HealthHub
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    attributes:
      label: iOS Version
      placeholder: e.g., iOS 26.0
  - type: input
    attributes:
      label: HealthHub Version
      placeholder: e.g., 3.3.0
